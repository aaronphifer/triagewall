name: Regression suite

on:
  pull_request:
    branches: ["main", "v0.4-stabilization"]
  push:
    branches: ["main", "v0.4-stabilization"]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install --requirement tests/requirements-ci.txt

      - name: Validate dashboard runtime lock resolves
        run: >-
          python -m pip install --dry-run
          --requirement triagewall/dashboard/requirements.txt

      - name: Run unit and security regressions
        run: python -m unittest discover -s tests

      - name: Verify gold-set evidence is current
        # Deterministic Layer 1 only: no Ollama, no GPU, no production data.
        # Fails if a guarded production input changed without fresh evidence.
        run: python scripts/gold_gate.py verify

      - name: Run SPC regressions
        run: PYTHONPATH=. python tests/test_spc.py

      - name: Run dashboard browser regressions
        run: node --test tests/test_dashboard_polling.js tests/test_configuration_editor.js

      - name: Compile Python sources
        run: python -m compileall -q triagewall tests scripts

      - name: Validate Docker Compose
        env:
          TRIAGEWALL_LAB_OPERATOR: ci-validation-only
          TRIAGEWALL_LAB_API_KEY_HASH: ci-validation-only
          TRIAGEWALL_LAB_SESSION_SECRET: ci-validation-only
          TRIAGEWALL_LAB_OLLAMA_URL: http://127.0.0.1:11434
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.wazuh.yml --profile wazuh config --quiet
          docker compose --profile lab config --quiet

      - name: Build Docker services
        env:
          TRIAGEWALL_LAB_OPERATOR: ci-validation-only
          TRIAGEWALL_LAB_API_KEY_HASH: ci-validation-only
          TRIAGEWALL_LAB_SESSION_SECRET: ci-validation-only
          TRIAGEWALL_LAB_OLLAMA_URL: http://127.0.0.1:11434
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.wazuh.yml
          --profile wazuh --profile lab build
